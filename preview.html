<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artemis Leo — Attack 6 frames</title><style>body{margin:0;background:#0d1424;color:#f4dfb3;font:15px system-ui;padding:24px}main{max-width:760px;margin:auto}canvas{width:min(90vw,480px);height:min(90vw,480px);background:repeating-conic-gradient(#28344c 0% 25%,#1a2437 0% 50%) 50% / 40px 40px;border:1px solid #b78b42;border-radius:16px}button{background:#d9a94d;border:0;border-radius:8px;padding:10px 18px;color:#19150f;font-weight:bold;cursor:pointer}small{color:#a8acb7}</style></head><body><main><h2>Leo Zodiac Guardian — Attack (6 frames)</h2><canvas width="512" height="512"></canvas><p><button id="b">Tạm dừng</button> &nbsp; <span id="t"></span></p><p><small>Bản thử mới chỉ có 6 tư thế Attack; Idle, Hit và Death chưa hoàn thành.</small></p></main><script>const im=new Image(),c=document.querySelector('canvas'),ctx=c.getContext('2d'),t=document.querySelector('#t'); im.src='spritesheets/leo_attack_6x1.png';let pause=false,f=0,last=0;document.querySelector('#b').onclick=()=>{pause=!pause;document.querySelector('#b').textContent=pause?'Tiếp tục':'Tạm dừng'};requestAnimationFrame(function tick(now){if(!pause&&now-last>115){last=now;ctx.clearRect(0,0,512,512);if(im.complete&&im.naturalWidth)ctx.drawImage(im, f*512,0,512,512,0,0,512,512);t.textContent='Khung '+(f+1)+'/6';f=(f+1)%6}requestAnimationFrame(tick)});</script></body></html>
